    или VDXR) — по вики FUS. Разрешение рендера менять только в одном месте (opencomposite.ini, SteamVR или VD), иначе оно перемножится. Нагрузку
    смотреть через Oculus Debug Tool или график Virtual Desktop. После отключения OC: Root Builder → Clear и очистить Overwrite.'
  verify: В окне SteamVR написано «Now Playing - OpenComposite_SkyrimVR» (по вики FUS), при VDXR игра идёт без SteamVR. Виртуальная клавиатура
    работает при вводе имени.
  note: OpenXR в обход SteamVR. FUS сообщал о приросте до ~30%. В этой сборке работает виртуальная клавиатура. Оверлеи SteamVR пропадают. DLL
    — в корень через Root Builder.
  risk: medium
  confidence: medium
  sources: 'whouses 171182: Stormcrown VR — 5.0.0; Panda''s, Tahrovin, Librum, Tempus — 3.0.1. Метаданные WJ: название страницы. Вики FUS: Using-opencomposite-with-Virtual-Desktop,
    Performance-adjustment, Troubleshooting (Root Builder Clear, Overwrite). Сниппет GitHub OpenOVR: opencomposite.ini ищется рядом с openvr_api.dll.
    Список dont: «Две сборки OpenComposite».'
