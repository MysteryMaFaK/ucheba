  config: 'SKSE\Plugins\GrassControl.ini (дефисные ключи, как в GrassControl.toml из репо). Задать: Use-grass-cache = true; Only-load-from-cache
    = true; Ray-cast-enabled = true (основная функция — трава не растёт в камнях и дорогах); DynDOLOD-Grass-Mode = 1 (Grass Cache Helper NG работает
    только с 1, и так дешевле для VR); Extend-grass-distance = false (при Mode 1); Super-dense-grass = false; Overwrite-min-grass-size = -1 (брать
    из ini). iMinGrassSize в SkyrimVR.ini [Grass] задать ДО прекэша: он запекается в кэш, FUS советует 60–100, больше — реже трава. Прекэш: в
    Root Builder добавить исключение для PrecacheGrass.txt; создать PrecacheGrass.txt в корне игры или запустить «Precache Grass» из меню Tools
    MO2. Вылеты во время генерации — норма, перезапускать. После любых изменений травы, ландшафта или ini — удалить кэш и сгенерировать заново.
    В DynDOLOD Advanced тоже выставить Grass LOD Mode 1.'
  verify: В sksevr.log GrassControl загружен. После прекэша в моде Grass Cache есть Grass\*.cgid. В игре трава не растёт сквозь камни и дороги,
    FPS на открытой местности выше.
  note: 'Прекэш травы: большой выигрыш в VR и основа для Grass LOD в DynDOLOD. После смены травы или iMinGrassSize кэш генерируется заново.'
  risk: medium
