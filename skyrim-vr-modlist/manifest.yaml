# Skyrim VR Core 2026 — манифест установки. Читает агент по SYSTEM_PROMPT.md.
meta:
  name: Skyrim VR Core 2026
  date: '2026-10-08'
  game: Skyrim VR 1.4.15
  script_extender: SKSEVR 2.0.12
  mod_manager: Mod Organizer 2 2.5.2 (портативный) + Root Builder 5.x
  scope: ядро сборки без текстур
  page: https://claude.ai/artifact/CtFycL6Py2fC2TDY7NZgCa
  tags:
    core: обязательно
    rec: рекомендую
    opt: по желанию
    alt: выбор
    try: проверить
  fields:
    kind: plugin_only | skse_dll | assets_only | mixed | external_tool | mo2_plugin | root_files | guide_steps
    install_target: mo2_mod | root_builder | external_tool | mo2_plugins_folder | manual_steps
    confidence: 'насколько проверены files/fomod/requires: high | medium | low'
phases:
- phase: 1
  title: Инструменты, корень игры, мастера и USSEP
  sections:
  - tools
  - base
- phase: 2
  title: SKSEVR, библиотеки, фиксы движка, производительность
  sections:
  - frameworks
  - fixes
  - perf
- phase: 3
  title: Шейдеры, свет и VR-ядро
  sections:
  - gfx
  - vr
- phase: 4
  title: Интерфейс и звук
  sections:
  - ui
  - audio
- phase: 5
  title: Свет, погода, вода, VFX, ландшафт
  sections:
  - world
  - land
- phase: 6
  title: Анимации и физика, затем Pandora
  sections:
  - anim
- phase: 7
  title: Бой, геймплей, мир и ИИ
  sections:
  - combat
  - immersion
- phase: 8
  title: Хайтек-новинки 2026 — по одному
  sections:
  - hitech
- phase: 9
  title: ИИ-NPC
  sections:
  - ai
- phase: 10
  title: Текстуры — отдельный этап, затем финальная генерация
  sections: []
system_requirements:
- name: Microsoft Visual C++ Redistributable (последний, x64)
  needed_by:
  - Dual Casting Fix VR [vr-92804]
  - SkyrimNet [ai-0]
  note: 'Системный компонент, не мод MO2. Страница Dual Casting Fix VR (rec) просит его явно. Проверить наличие в Windows, при отсутствии поставить
    с сайта Microsoft. Уверенность: высокая.'
- name: .NET SDK (для Synthesis)
  needed_by:
  - Synthesis [tools-6]
  note: 'Системный компонент. Нужную версию Synthesis покажет при первом запуске. Версию не угадывать. Уверенность: средняя.'
- name: OpenXR-рантайм (SteamVR, VDXR или Meta)
  needed_by:
  - OpenComposite Unleashed for Skyrim VR [perf-171182]
  note: 'Не мод. В Virtual Desktop Streamer, приложении Oculus и SteamVR выставить один рантайм. Проверить, но не ставить из MO2. Уверенность:
    средняя.'
- name: Windows Subsystem for Linux (WSL)
  needed_by:
  - CHIM [ai-126330]
  note: 'Нужен CHIM (opt, по умолчанию не ставить). Включение — системная настройка, не MO2. Уверенность: средняя.'
- name: DwemerDistro (сервер CHIM)
  needed_by:
  - CHIM [ai-126330]
  note: 'Внешний сервер в WSL, не мод. Нужен только если выбран CHIM. Установку вести по инструкции CHIM: неизвестно, общие правила. Уверенность:
    средняя.'
choose_one_groups:
- group: masters-path
  members:
  - Путь A. Обновлённые мастера SSE 1.6.1170 + 4 бесплатных CC [base-0]
  - Путь B. USSEP 4.2.5b + Skyrim VR USSEP patch for 4.2.5b [base-91475]
  default: Путь A. Обновлённые мастера SSE 1.6.1170 + 4 бесплатных CC [base-0] (путь A), если на ПК есть купленная SE/AE 1.6.1170; иначе Путь
    B. USSEP 4.2.5b + Skyrim VR USSEP patch for 4.2.5b [base-91475] (путь B)
  rule: 'Ровно один путь обязателен: любой USSEP-зависимый мод (Realistic Mining and Chopping for VR + VR Refit [immersion-16692], Unaggressive
    Dragon Priests Fix + Dwemer Gates Don''t Reset [fixes-69026], Unofficial Skyrim Modder''s Patch (USMP) [fixes-49616]) требует USSEP, а он
    идёт только внутри пути. Путь A тянет USSEP (последний, 4.3.x) [base-266], Skyrim VR Strings Fix for Updated SSE Master Files [base-176040],
    Survival Mode Prompt Removed (Disable Permanently) [base-59049], Skyrim VR Survival Text Removed [base-177398], Skyrim VR Fixes for Latest
    USSEP [base-177650](opt). Путь B тянет только Путь B. USSEP 4.2.5b + Skyrim VR USSEP patch for 4.2.5b [base-91475] и USSEP 4.2.5b. Смешивать
    детали путей нельзя. Теги alt у обоих путей — это не отказ, а выбор.'
- group: shaders
  members:
  - Open Shaders [gfx-180419]
  - Community Shaders Expanded (CSX), VR-сборка [gfx-166950]
  default: Open Shaders [gfx-180419] (Open Shaders)
  rule: Один шейдерный пакет. CSX — только по явному запросу. Community Shaders 1.7+, ENB, Intellightent и DLSS5-форк не ставить (dont).
- group: water
  members:
  - Simplicity of Sea [world-56520]
  - Water for ENB [world-37061]
  default: Simplicity of Sea [world-56520] (Simplicity of Sea)
  rule: Одна вода. Water for ENB — не ENB-пресет, а обычный водный мод; можно, но только вместо Simplicity of Sea. Natural Waterfalls (Natural
    Waterfalls [world-87261]) ставить ниже выбранного.
- group: grass
  members:
  - Merethic Grasslands [land-164058]
  - Cathedral 3D Grass Library + 3D-растения [land-80687]
  default: Merethic Grasslands [land-164058] (Merethic Grasslands)
  rule: 'Выбирается один травяной набор. Файл «DrJacopo''s - 3D Grass Library - Meshes» из Cathedral 3D Grass Library + 3D-растения [land-80687]
    ставится ВСЕГДА, при любом выборе: его требует Merethic. Остальное из Cathedral 3D Grass Library + 3D-растения [land-80687] (Resource Textures,
    сет Cathedral/Freak''s Floral Fields, 3D-растения) — только если вместо Merethic выбран Cathedral. Meshes стоят выше Merethic.'
- group: footprints
  members:
  - Footprints + SPID for Footprints [land-3808]
  - Dynamic Footprints SKSE [hitech-175254]
  - DynamicShader — DynamicSnow [hitech-189713]
  default: Footprints + SPID for Footprints [land-3808] (Footprints + SPID for Footprints)
  rule: 'Один источник следов на снегу и песке. Dynamic Footprints (try) и DynamicShader — DynamicSnow (try, VR не подтверждён) — только по явному
    запросу и на отдельном сохранении. DynamicSnow дополнительно дублирует фичу снега Open Shaders. Dynamic Terrain Deformation не ставить (dont).
    Уверенность: средняя.'
- group: racemenu
  members:
  - RacemenuVR [ui-156898]
  - RaceMenu VR 2 [ui-192158]
  default: RacemenuVR [ui-156898] (RacemenuVR + RaceMenu 0.4.19.16)
  rule: 'Одна пара: RaceMenu (#19080) нужной версии + VR-мод. RaceMenu VR 2 — только по запросу, база 0.4.20.0. Оба мода opt/try, по умолчанию
    можно не ставить. RaceMenu VR Layout Fix и Position Tweaks не ставить с RaceMenu VR 2.'
- group: audio-stack
  members:
  - Audio Overhaul for Skyrim [audio-12466]
  - Immersive Sounds Compendium + AOS–ISC patch [audio-523]
  default: Audio Overhaul for Skyrim [audio-12466] (Audio Overhaul for Skyrim)
  rule: Один звуковой стек. ISC вместо AOS — на месте AOS, плюс ISC-SRDified (#78446) ниже. Оба сразу — только с патчем AOS–ISC (#36761), по умолчанию
    не делать. RSE, RISE и ASIF (Regional Sounds Expansion + Reverb Interior Sounds Expansion [audio-77829], Acoustic Space Improvement Fixes
    [audio-78992]) ставятся при любом выборе.
- group: item-info
  members:
  - Inventory Interface Information Injector [frameworks-85702]
  - I5 — Information Injector Improved [ui-192976]
  default: Inventory Interface Information Injector [frameworks-85702] (I4, файл VR 1.1.0)
  rule: 'Использовать I4. I5 (try) — только по запросу и вместо I4, не вместе: спецификации спорят, замена это или надстройка. Norden UI и QuickLoot
    IE рассчитаны на I4. Уверенность: низкая.'
- group: hud-style
  members:
  - Clear HUD VR + Clean Menu [ui-49657]
  - Minimal Enemy Healthbar VR [ui-17812]
  - Norden UI — VR Edition [ui-169537]
  default: Clear HUD VR + Clean Menu [ui-49657] + Minimal Enemy Healthbar VR [ui-17812] (Clear HUD VR + Clean Menu и Minimal Enemy Healthbar VR)
  rule: 'Либо ветка HUD-твиков (Clear HUD VR + Clean Menu [ui-49657] + Minimal Enemy Healthbar VR [ui-17812], можно вместе), либо Norden UI VR
    (Norden UI — VR Edition [ui-169537]). Общий HUD-файл достаётся нижнему моду, поэтому HUD-твики перекроют HUD Norden. Все три — opt. Из Clean
    Menu не брать «Unobtrusive HUD». Уверенность: средняя.'
- group: spell-aim
  members:
  - Magic Improvements for Skyrim VR [vr-55751]
  - Spell Auto-Aim VR [vr-119689]
  default: Magic Improvements for Skyrim VR [vr-55751] (Magic Improvements for Skyrim VR)
  rule: 'Spell Auto-Aim VR (opt) частично дублирует прицеливание Magic Improvements. По умолчанию не ставить. Если ставить, подбирать силу в INI
    и проверять отдельно. SpellBender VR не ставить рядом ни с одним из двух. Уверенность: средняя.'
- group: jump-scheme
  members:
  - Sprint Jump VR [vr-28354]
  - Auto Sneak and Jump VR [vr-23649]
  default: Sprint Jump VR [vr-28354] (Sprint Jump VR)
  rule: 'Одна схема прыжка. Auto Sneak and Jump VR можно держать вместе только при отключённом авто-прыжке в его INI (ключ JumpThreshold и соседние);
    иначе только Sprint Jump VR. Физическое приседание встроенной игры отключить в playroom. Уверенность: средняя.'
- group: ai-npc
  members:
  - SkyrimNet [ai-0]
  - Mantella [ai-98631]
  - CHIM [ai-126330]
  default: ничего (все три opt)
  rule: 'Не больше одного ИИ-NPC мода: SkyrimNet, Mantella и CHIM несовместимы друг с другом. Fuz Ro D-oh VR не ставить, если мод его не требует
    (dont).'
- group: behavior-engine
  members:
  - Pandora Behaviour Engine+ [tools-133232]
  default: Pandora Behaviour Engine+ [tools-133232] (Pandora Behaviour Engine+)
  rule: Один генератор. Nemesis в манифесте нет, вместе с Pandora не ставить. Версия Pandora не старше 4.1.2-beta (там вернули Skyrim VR).
- group: mcm-backup
  members:
  - MCM Memory [tools-189722]
  default: MCM Memory [tools-189722] (MCM Memory)
  rule: MCM Recorder и MCM Bridge не ставить. MCM Memory 1.5.3 или новее.
- group: opencomposite
  members:
  - OpenComposite Unleashed for Skyrim VR [perf-171182]
  default: OpenComposite Unleashed for Skyrim VR [perf-171182] (Unleashed 5.0.0)
  rule: Одна сборка OpenComposite. Старый «OpenComposite Fixes Custom Build» (#85389) не ставить (dont).
- group: climbing
  members:
  - VR Climbing — Aelove Ver [vr-170321]
  default: VR Climbing — Aelove Ver [vr-170321] (VR Climbing Aelove Ver)
  rule: 'Оригинальный VR Climbing (#168553) не ставить: форк самостоятельный. SkyClimb, SkyParkour, StepUpOnto и EVG Animated Traversal — dont.'
- group: subtitles
  members:
  - Floating Subtitles VR [ui-183714]
  default: Floating Subtitles VR [ui-183714] (Floating Subtitles VR)
  rule: Subtitles VR (#131015) не ставить. Fuz Ro D-oh VR не нужен.
order_rules:
- 'Правило MO2: нижний мод левой панели побеждает. Ниже = ближе к низу списка. Все правила ниже считать от этого.'
- 'Разделители сверху вниз: 00 Инструменты и корень, 01 Мастера и USSEP, 02 SKSEVR и библиотеки, 03 Фиксы движка, 04 Шейдеры и свет, 05 VR-ядро,
  06 Хайтек 2026, 07 Интерфейс, 08 Звук, 09 Свет, погода, вода, VFX, 10 Ландшафт, трава, деревья, 11 Анимации и физика, 12 Бой и геймплей, 13
  Мир, ИИ, погружение, 14 ИИ-NPC, 15 VR-рантайм и производительность, 16 Текстуры (создать, пока пусто), 17 Патчи (создать), 18 Сгенерированное
  (создать). Манифест mo2_order эти последние три и разделы 06, 13, 15 не нумерует.'
- '00: SKSEVR (первым), VR Address Library ниже, Engine Fixes VR Part 2 (Root), OpenComposite Unleashed (Root, openvr_api.dll и opencomposite.ini),
  True 3D Sound (Root). Root Builder сам установить в plugins MO2 заранее и перезапустить MO2. DynDOLOD Resources SE 3 — рано в списке.'
- '01 путь A: Updated Masters → Strings Fix → Survival Text Removed → USSEP 4.3.x → Survival Mode Prompt Removed → VR Fixes for Latest USSEP (если
  нужен) → Cleaned Masters. Путь B: USSEP 4.2.5b → его патч совместимости → Cleaned Masters. Cleaned Masters всегда ниже мастеров и их патчей.
  Чистить мастера Quick Auto Clean после установки пути.'
- '02: каждый VR-мод ниже основного (Papyrus Extender, po3 Tweaks, Container Distribution Framework, PapyrusUtil ESL Patch ниже PapyrusUtil VR).
  ImGui VR Helper ниже SKSE Menu Framework. Behavior Data Injector → BDI Universal Support, и только потом CPR (13). I4 выше всех его иконочных
  паков и патчей. Base Object Swapper VR выше Lightened Skyrim BOS (03).'
- '03: Poached Bugs VR Core → Simonrim Choice Config ниже; USSEP (01) → SCROTE → Dragonactorscript Infinite Loop Fix и CritterSpawn Congestion
  Fix ниже SCROTE (каждый побеждает в своём скрипте). Assorted Mesh Fixes → Unofficial Material Fix → Fixed Mesh Lighting. Water Effects Brightness
  Fix выше Splashes и Simplicity of Sea. USMP ниже USSEP.'
- '04: Open Shaders (или CSX) → «Open Shaders — настройки» (SettingsUser.json) сразу ниже; Light Placer → Light Placer VR ниже. Моды с файлами
  под CS (Azurite HDR, Map Weather — CS, Parallax Spell Impacts) — ниже Open Shaders.'
- '05 VR-ядро: SkyUI VR (02) → VRIK → HIGGS → PLANCK → PLANCK Stability Patch ниже. Затем Immersive Weapon Penetration VR → Physical Collision
  VR → True Wield VR → Swap Drop and Hold Redux. Instant Equip VR выше Swap Drop и Steeds of Ultima. Spell Wheel VR выше Durability VR и Steeds
  of Ultima. Weapon Throw VR выше Pull Arrows VR и Durability VR. Simple Realistic Archery VR выше Seamless Arrow Nocking VR. Аддоны VRIK и HIGGS
  ниже своих баз.'
- '06 Хайтек: Smooth Terrain ниже Open Shaders; DynamicSnow (если есть) ниже Smooth Terrain и DynamicShader Core. Broken Feathers, Weapon Throw
  VR, HIGGS выше Pull Arrows VR. Immersive Harvesting VR ниже HIGGS и Interactive Activators VR. ISPVR ниже VRIK и MISVR. Steeds of Omega VR ниже
  Steeds of Ultima.'
- '07 Интерфейс: SkyUI VR → Norden UI VR (его заплатки ниже) → SKSEVR Perk Extender (перенести из 05). moreHUD VR ниже SkyUI VR; Clear HUD VR
  и Minimal Enemy Healthbar VR ниже moreHUD и Norden. Floating Subtitles база → Floating Subtitles VR ниже. RaceMenu база → RacemenuVR ниже. QuickLoot
  IE ниже I4 и SkyUI VR. No Menu Fade Out VR ниже DME (05).'
- '08 Звук: UHDAP первым, затем AOS (или ISC на его месте) → RSE → RISE → ASIF. ISC-SRDified ниже ISC. Патч AOS–ISC ниже обоих. Immersive Draw
  Sheathe Sounds VR — ниже AOS. Wildwood Echoes, Murmurs and Mead, Haunting Harmonies, Whispers — ниже RSE и RISE.'
- '09: Lux → Lux Via → Lux Orbis; Azurite → MCM/HDR → Storm Lightning; Simplicity of Sea (или Water for ENB) → Color Tweaks → Natural Waterfalls;
  Splashes of Skyrim/Storms (VR ниже основного); Dynamic Wind Framework → Dynamic Wind — Skyrim → Bobbing Framework; Interactive Waters ниже Splashes
  VR; Deadly Spell Impacts → Parallax Spell Impacts; Embers XD → CS Light → Helios (самые нижние в разделе).'
- '10: 3D Grass Library Meshes → Merethic; HLT → его LOD-аддон; Seasons of Skyrim → VR-мод → сезонные патчи → XPMF; Footprints → SPID for Footprints
  → фиксы; Landscape Fixes For Grass Mods → патчи к нему. LOD Model Library ниже DynDOLOD Resources SE 3 (00).'
- '11: XPMSSE → «VR-фикс» (сразу ниже) → FSMP → «XML VR» ниже → Dynamic Armor Physics → OAR → Paired Animation Improvements → NPC Animation Remix
  → остальные OAR-пакеты (Gesture Remix ниже NPC Remix) → Neutral VR Animations. Приоритет между OAR-пакетами задаётся полем priority в config.json,
  не порядком MO2. Variadic и A-Pose (try) — последними, по одному.'
- '12: Mysticism → Adamant → Adamant VR Tweaks → Blade and Blunt → Blade and Blunt VR (сразу ниже) → Thaumaturgy → Apothecary → Mundus. Core Impact
  Framework → Sanguine Symphony (сразу ниже) → Accuracy → Dynamic Bloodpool Framework. Dismembering Framework → DF Asset Packs → Next-Gen Decapitations.
  Simple Offence Suppression (SE) → SOS VR сразу ниже. Physical Dodge VR ниже PLANCK и PCVR.'
- '13: FEC → FEC VR → патч Embers XD–FEC. Enhanced Reanimation → Enhanced Reanimation VR. NND → Tamrielic Names. CPR → CPR VR DLL. AI Overhaul
  ниже USSEP и NPC-модов, его патчи ниже. Realistic Mining and Chopping → VR Refit. Dirt and Blood → VR-патч. Dynamic Things Alternative ниже
  BOS VR. Gift by Hand VR ниже HIGGS.'
- '14 ИИ-NPC: ниже всех NPC-модов. Prisma UI и Media Keys Fix (если понадобятся) — в 02.'
- '15: S.L.A.C.K., VR FPS Stabilizer — конфликтов нет. OpenComposite в 00, не здесь.'
- '17 Патчи: все Patch Hub (Lux, Lux Via, Lux Orbis, eFPS) и вывод Lights Conflict Resolver — ниже модов, которые они патчат. Патч Embers XD–Immersive
  Smithing — ниже Embers XD и Immersive Smithing.'
- '18 Сгенерированное, сверху вниз: Pandora Output → PGPatcher Output → Synthesis Output → Grass Cache → xLODGen_Output → TexGen_Output → DynDOLOD_Output
  (самый нижний). SSE Terrain Tamriel включать как мод только на время генерации xLODGen.'
- 'Вкладка конфликтов MO2: у SKSEVR защищать скрипты через Hide у чужих файлов, не сдвигая SKSEVR. Спорные skeleton*.nif разбирать вручную, не
  гадать.'
- Никогда не сортировать мод вручную сверх этих правил без причины в конфликтах. Перед правкой записать, какой мод должен победить.
plugin_rules:
- Сначала LOOT после каждой порции модов. Ручные правила ниже добавлять только при подтверждённом конфликте. Поведение LOOT с ESL в VR не подтверждено,
  проверять список вручную.
- Skyrim VR ESL Support должен быть установлен до любого ESL/ESP-FE плагина (пути A и B). В Engine Fixes VR 7.x ключ bMaxStdIO = true ([Patches]
  в EngineFixes.toml, по умолчанию уже true; числа не задаются).
- Мастера (Skyrim, Update, Dawnguard, HearthFires, Dragonborn, CC пути A) — по LOOT. Плагин CC Survival Mode оставить включённым (требует USSEP
  4.3.x).
- 'USSEP сразу после мастеров и CC. Сразу за ним Skyrim VR Fixes for Latest USSEP (ESL-мастер), если он нужен. После USSEP же: USMP, SCROTE (если
  есть плагин), CritterSpawn Congestion Fix, Unaggressive Dragon Priests + Dwemer Gates, Realistic Mining and Chopping и VR Refit, Mantella.'
- 'Navigator — Navmesh Fixes высоко в порядке загрузки. Не чистить в xEdit: «грязные» записи намеренные.'
- Lux Patch Hub и прочие патчи — после Lux и патчируемых плагинов. CS Light.esp поздно, после True Light и Window Shadows Ultimate, если они есть.
  Helios.esp после Lux и CS Light. Storm Lightning после Azurite.
- VRIK.esp и higgs_vr.esp — по LOOT. Плагин Arctal's VRIK Tweaks (ESL) после VRIK.esp. XPMSSE.esp включить, если он есть в архиве. ESP ISPVR включить
  в plugins.txt.
- 'Боевые плагины: Mysticism → Adamant → Blade and Blunt. Thaumaturgy, Apothecary, Mundus — после Adamant. Патчи под Adamant — после Adamant.
  Патч Apothecary — после Apothecary. Dismembering Framework выше своих пакетов. NPCs Take Cover — после USSEP.'
- AI Overhaul — после USSEP и модов, правящих NPC и пакеты ИИ. Если взят AE-файл (ESL) и мастера красные — заменить на SE Only 1.8.7. VR-патч
  Dirt and Blood — после основного плагина.
- FEC.esp — после Papyrus Extender. Патч Embers XD–FEC — после обоих.
- 'Звук: все звуковые плагины после Sound Record Distributor. ASIF «Plugin Version» — после RISE (в SkyPatcher-версии плагина нет). ISC-SRDified
  и патч AOS–ISC — после своих баз.'
- SkyrimNet.esp — после Skyrim VR ESL Support. Остальное по LOOT.
- DynDOLOD.esm и DynDOLOD.esp ставит LOOT. SSE Terrain Tamriel.esm включать только на время генерации xLODGen.
- Synthesis.esp — всегда последним, без исключений, даже после DynDOLOD (если Synthesis запускали ещё раз).
resolved_contradictions:
- keys:
  - vr-81220
  - tools-133232
