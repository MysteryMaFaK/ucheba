  config: 'openvr_api.dll и opencomposite.ini должны лежать в папке Root внутри мода. Если её нет — создать и перенести туда файлы. Root Builder
    подменит openvr_api.dll в корне игры. OpenXR-рантайм: в Virtual Desktop Streamer, приложении Oculus и SteamVR выставить один рантайм (SteamVR
    или VDXR) — по вики FUS. Разрешение рендера менять только в одном месте (opencomposite.ini, SteamVR или VD), иначе оно перемножится. Нагрузку
