choose_one_groups:
- group: masters-path
  members:
  - Путь A. Обновлённые мастера SSE 1.6.1170 + 4 бесплатных CC
  - Путь B. USSEP 4.2.5b + Skyrim VR USSEP patch for 4.2.5b
  default: Путь A. Обновлённые мастера SSE 1.6.1170 + 4 бесплатных CC
  rule: ставится один; по умолчанию первый, пока критик не уточнил
- group: shaders
