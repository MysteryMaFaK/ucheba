  files: «Open Composite Unleashed for Skyrim VR» 5.0.0 (Stormcrown VR, 2026-09-19). Название страницы на Nexus — «Open Composite XR with Working
    Keyboard for VR».
  fomod: неизвестно — общие правила
  requires:
  - Root Builder (#31720)
  - 'OpenXR-рантайм: SteamVR, VDXR или Meta (не мод)'
