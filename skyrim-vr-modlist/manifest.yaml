do_not_install:
- what: Community Shaders 1.7 и новее
  why: Официальный CS убрал поддержку VR. Нужен Open Shaders или CSX.
- what: Два шейдерных пакета сразу
  why: Open Shaders, CSX и CS используют одни и те же файлы. Только один.
- what: ENB
  why: Несовместим с семейством CS и слишком дорог для VR.
- what: SSE Engine Fixes, Address Library for SKSE, SKSE64
  why: Это версии для SE/AE. В VR — Engine Fixes VR, VR Address Library, SKSEVR.
- what: Backported Extended ESL Support
  why: Без VR-поддержки. Вместо него Skyrim VR ESL Support.
- what: Scrambled Bugs
  why: В VR не работает. Вместо него Poached Bugs VR.
- what: SSE Display Tweaks
  why: Нет VR-сборки, частоту кадров в VR задаёт шлем.
- what: Precision, True Directional Movement, SkyParkour, SkyClimb
  why: Только для плоского режима. В VR их роль играют PLANCK, Physical Collision VR, VR Climbing.
- what: Skyrim Upscaler (PureDark, включая AIO 2026) или vrperfkit вместе с апскейлом Open Shaders
  why: Два апскейлера дерутся за один кадр, а AIO 2026 вообще сделан для плоской игры. Апскейл — только встроенный.
- what: ENB Light и Particle Lights for ENB
  why: Не работают с CS 1.4+ и Open Shaders. Свет — через Light Placer. Исключение — CSX.
- what: Volumetric Mists с Azurite III
  why: FUS убрал его ради производительности, автор погоды больше не рекомендует.
- what: Разделённые меши Lux
  why: С Light Limit Fix не нужны, только добавляют draw calls.
- what: Две сборки OpenComposite
  why: Старый OpenComposite Fixes Custom Build или Unleashed — что-то одно.
- what: Fuz Ro D-oh VR без необходимости
  why: Принудительно включает субтитры. Ставить, только если его требует другой мод.
- what: Dynamic Terrain Deformation, Grid Inventory
  why: 'Ваши примеры, но только SE/AE: в исходниках VR выключен. В VR вместо них Smooth Terrain, Dynamic Footprints.'
- what: Show Player In Inventory
  why: Работает через камеру от третьего лица в плоском меню. В VR — Inventory Selfie VR Redux.
- what: Meridian UI и моды на нём
  why: Интерфейс на Chromium только для SE/AE, VR в разработке.
- what: HorsePower, Skyrim Mounted Movesets
  why: SE-DLL и анимации от третьего лица. В VR — Steeds of Ultima и Steeds of Omega VR.
- what: StepUpOnto, EVG Animated Traversal, DovaJump
  why: Перелезание и прыжки игрока для плоского режима. В VR — VR Climbing.
- what: Intellightent
  why: Уже встроен в Open Shaders как Shadow Caster Manager, отдельная DLL его отключит.
- what: EVLaS (DLL-версия)
  why: Только SE/AE, объёмный свет уже даёт Open Shaders.
- what: TrueHUD, Detection Meter, Oxygen Meter 2, Compass Navigation Overhaul, Tween Menu Overhaul, Loading Menu Overhaul, Dragonborn's Bestiary
  why: Плоские HUD и меню на SE-DLL.
- what: SmoothCam, First Person FOV и Height Fix, Camera Persistence Fixes, Auto Input Switch, BTPS, Better AltTab
  why: Камеру и ввод в VR задают шлем и контроллеры.
- what: CFPAO, Female/Male Player Animations, Disable Turn Animation, Offset Movement Animation, Dynamic Crafting Animations
  why: 'Анимации игрока: телом управляет VRIK.'
- what: Custom Skills Framework, Console Commands Extender, LeveledList Crash Fix, Sprint Sneak Movement Speed Fix, Equip Enchantment Fix, CARP,
    Better Combat Escape NG, Survival Mode Improved, IFrame Generator, Use or Take, KreatE, Classic Sprinting Redone, Simple Dual Sheath
  why: Популярные в SE-сборках DLL без VR-версии — проверено по каждому.
- what: USSEP Behaviour Patch
  why: SE-патч поведений; поведения VR собирает Pandora.
- what: Nemesis вместе с Pandora
  why: Оба пишут одни и те же файлы. Только один генератор.
- what: Open Shaders With DLSS5 Neural Rendering
  why: Неофициальный экспериментальный форк, с Open Shaders не смешивать.
final_generation:
- Установлены все моды, включая текстуры. LOOT, ручная проверка конфликтов в xEdit.
- ParallaxGen (PGPatcher) — если ставили PBR или parallax-текстуры.
- Synthesis-патчеры.
- Прекэш травы через NGIO, папку Grass из Overwrite — в отдельный мод.
- 'xLODGen: LOD рельефа с SSE Terrain Tamriel.'
- TexGen, затем DynDOLOD 3 с Resources SE 3 и DynDOLOD DLL NG. Руководство — DynDOLOD_Manual_TES5VR в архиве.
- 'Тестовый прогон: Вайтран, Рифтен, лес у Ривервуда. Время кадра, лог Crash Logger.'
